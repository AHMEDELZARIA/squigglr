<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3220 1500" width="1200" height="559" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="3220" height="1500" fill="#ffffff"/><g transform="translate(40 150)">
<rect width="1000" height="1000" fill="#ffffff" stroke="#cdd2e0" stroke-width="4" rx="20"/>
<path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#8e84d6" stroke-width="8" stroke-dasharray="26 16"/>
<circle cx="500" cy="500" r="14" fill="#8e84d6"/>
<path d="M100 150 H300 V350 H100 Z" fill="none" stroke="#23304a" stroke-width="12" stroke-linejoin="round"/>
<circle cx="200" cy="250" r="14" fill="#b84a30"/>
</g>
<text x="540" y="110" font-size="44" text-anchor="middle" font-weight="bold" fill="#23304a">1. What the child drew</text>
<text x="540" y="1220" font-size="36" text-anchor="middle" fill="#23304a">Side 200, centre (200, 250)</text><text x="540" y="1268" font-size="36" text-anchor="middle" fill="#23304a">Lesson square: side 500, centre (500, 500)</text><g transform="translate(1100 150)">
<rect width="1000" height="1000" fill="#ffffff" stroke="#cdd2e0" stroke-width="4" rx="20"/>
<path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#8e84d6" stroke-width="8" stroke-dasharray="26 16"/>
<circle cx="500" cy="500" r="14" fill="#8e84d6"/>
<path d="M250 375 H750 V875 H250 Z" fill="none" stroke="#23304a" stroke-width="12" stroke-linejoin="round"/>
<circle cx="500" cy="625" r="14" fill="#b84a30"/>
</g>
<text x="1600" y="110" font-size="44" text-anchor="middle" font-weight="bold" fill="#23304a">2. Scale × 2.5</text>
<text x="1600" y="1220" font-size="36" text-anchor="middle" fill="#23304a">Scale = 500 ÷ 200 = 2.5</text><text x="1600" y="1268" font-size="36" text-anchor="middle" fill="#23304a">Now the right size; centre is (500, 625)</text><g transform="translate(2160 150)">
<rect width="1000" height="1000" fill="#ffffff" stroke="#cdd2e0" stroke-width="4" rx="20"/>
<path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#8e84d6" stroke-width="8" stroke-dasharray="26 16"/>
<circle cx="500" cy="500" r="14" fill="#8e84d6"/>
<path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#23304a" stroke-width="12" stroke-linejoin="round"/>
<circle cx="500" cy="500" r="14" fill="#b84a30"/>
</g>
<text x="2660" y="110" font-size="44" text-anchor="middle" font-weight="bold" fill="#23304a">3. Shift up by 125</text>
<text x="2660" y="1220" font-size="36" text-anchor="middle" fill="#23304a">dx = 500 − 500 = 0, dy = 500 − 625 = −125</text><text x="2660" y="1268" font-size="36" text-anchor="middle" fill="#23304a">Lands on the lesson square: now scored</text><path d="M1048 650 h44" stroke="#5e51b8" stroke-width="8" marker-end="url(#a)"/><path d="M2108 650 h44" stroke="#5e51b8" stroke-width="8" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e51b8"/></marker></defs><text x="1610" y="1400" font-size="32" text-anchor="middle" fill="#5b6478">Dashed purple: the lesson square. Dark: the child's drawing. Dots: centres (purple = lesson, red = drawing).</text><text x="1610" y="1450" font-size="32" text-anchor="middle" fill="#5b6478">Each point: new x = x × scale + dx, new y = y × scale + dy. Same scale across and down, so the shape is never squashed.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>