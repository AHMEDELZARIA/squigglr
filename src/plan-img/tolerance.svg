<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1240" width="600" height="744" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="1240" fill="#ffffff"/>
  <text x="500" y="70" font-size="34" text-anchor="middle" fill="#23304a" font-weight="bold">Tolerance on the square lesson</text>
  <text x="500" y="160" font-size="28" text-anchor="middle" fill="#23304a">Wobbly, but inside the green band: <tspan fill="#24735b" font-weight="bold">counts as drawn</tspan></text>
  <path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#d3eee3" stroke-width="70"/>
  <path d="M250 250 H750 V750 H250 Z" fill="none" stroke="#8e84d6" stroke-width="6" stroke-dasharray="22 14"/>
  <!-- diagonal -->
  <line x1="250" y1="250" x2="750" y2="750" stroke="#5e51b8" stroke-width="3" stroke-dasharray="6 8"/>
  <text x="525" y="470" font-size="28" fill="#5e51b8" font-weight="bold" transform="rotate(45 525 470)">diagonal = 707 units</text>
  <!-- strokes -->
  <path d="M255 262 C320 235, 380 278, 450 255 S580 230, 640 262 S720 240, 745 252" fill="none" stroke="#23304a" stroke-width="9" stroke-linecap="round"/>
  <path d="M752 255 Q756 340 785 400" fill="none" stroke="#23304a" stroke-width="9" stroke-linecap="round"/>
  <path d="M785 400 Q825 500 785 610" fill="none" stroke="#b84a30" stroke-width="9" stroke-linecap="round"/>
  <path d="M785 610 Q752 680 750 745" fill="none" stroke="#23304a" stroke-width="9" stroke-linecap="round"/>
  <text x="835" y="480" font-size="28" fill="#b84a30" font-weight="bold">outside</text>
  <text x="835" y="514" font-size="28" fill="#b84a30">the band:</text>
  <text x="835" y="548" font-size="28" fill="#b84a30">off figure</text>
  <!-- width marker on the left side -->
  <line x1="215" y1="560" x2="285" y2="560" stroke="#24735b" stroke-width="4"/>
  <line x1="215" y1="540" x2="215" y2="580" stroke="#24735b" stroke-width="4"/>
  <line x1="285" y1="540" x2="285" y2="580" stroke="#24735b" stroke-width="4"/>
  <text x="195" y="505" font-size="26" text-anchor="end" fill="#24735b">35 units</text>
  <text x="195" y="537" font-size="26" text-anchor="end" fill="#24735b">each side</text>
  <!-- side length -->
  <text x="500" y="820" font-size="26" text-anchor="middle" fill="#5b6478">side = 500 units (250 to 750)</text>
  <!-- calculation -->
  <rect x="80" y="870" width="840" height="250" rx="20" fill="#f4f5f8"/>
  <text x="110" y="920" font-size="30" fill="#23304a" font-weight="bold">How it is calculated (lib/evaluation.ts)</text>
  <text x="110" y="970" font-size="28" fill="#23304a">tolerance = TRACE_TOL × diagonal of the shape's box</text>
  <text x="110" y="1015" font-size="28" fill="#23304a">diagonal = √(500² + 500²) = 500 × √2 ≈ 707 units</text>
  <text x="110" y="1060" font-size="28" fill="#23304a">tolerance = 5% × 707 ≈ <tspan font-weight="bold" fill="#24735b">35 units</tspan> each side of every line</text>
  <text x="110" y="1100" font-size="24" fill="#5b6478">(7% of one side. A bigger shape gets a bigger band.)</text>
  <text x="500" y="1165" font-size="24" text-anchor="middle" fill="#5b6478">Dashed purple: the square. Green: the tolerance. Dark: the child's strokes.</text>
  <text x="500" y="1200" font-size="24" text-anchor="middle" fill="#5b6478">Left and bottom sides not drawn: missed parts.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
